spring.application.name=bso-demo
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bso}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.error.include-message=never
