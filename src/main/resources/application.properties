spring.application.name=bso-demo
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bso}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
server.error.include-message=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Reverse proxy terminates TLS. Trust X-Forwarded-Proto/Host/Port from local Nginx.
# Do NOT expose application port directly on the school LAN.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=12MB

# Never trust forwarded headers from arbitrary clients. In production the web
# service is bound to loopback and only the managed Nginx may reach it.
server.forward-headers-strategy=framework
